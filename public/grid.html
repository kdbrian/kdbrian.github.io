<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Kinetic Divider Grid - a photo mosaic whose black divider gutters drift continuously, with live motion and background controls." /><title>Kinetic Divider Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Space+Mono:wght@400;700&display=swap"
/>

<style>
[hidden]{display:none!important}
img{max-width:100%}
  /* ------------------------------------------------------------------
     Kinetic Divider Grid — one cinema-black world, painted explicitly.
     The dividers are the subject: their fill is a configurable surface
     (solid / gradient / image) shown through the grid's gutters, and
     the placard reads as its difference against whatever sits behind.
  ------------------------------------------------------------------ */
  :root {
    --ink: #0b0b0c;
    --ink-soft: #151517;
    --bone: #e9e3d6;
    --bone-dim: #b8b2a4;
    --greige: #8b8574;
    --terracotta: #c25842; /* accent — the polka-dot statue red */
    --terracotta-bright: #d9694f;
    --dusk: #45568a; /* twilight-sky blue */
    --panel-bg: rgba(12, 12, 13, 0.82);
    --panel-line: rgba(233, 227, 214, 0.14);
    --gutter: 12px; /* JS overwrites via the Divider control */
    --ease-ui: cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--bone);
    font-family: "Space Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    position: fixed;
    inset: 0;
    background: var(--ink);
    cursor: pointer;
  }

  /* ---- the configurable surface behind the gutters ------------ */
  .backdrop {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-color: var(--ink);
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    transition: background-color 0.3s var(--ease-ui);
  }

  /* ---- the grid (transparent gutters reveal the backdrop) ---- */
  .grid {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr; /* JS overwrites every frame */
    grid-template-rows: 1fr 1fr;
    gap: var(--gutter);
    padding: var(--gutter);
    background: transparent;
  }

  .cell {
    position: relative;
    margin: 0;
    overflow: hidden;
    background: var(--ink-soft);
    box-shadow: inset 0 0 0 1px rgba(233, 227, 214, 0.05);
  }

  .cell img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 50%;
    display: block;
    will-change: object-position;
  }

  /* ---- placard: difference against everything behind it ------ */
  .placard {
    position: absolute;
    top: clamp(18px, 3.4vw, 40px);
    left: clamp(18px, 3.4vw, 44px);
    z-index: 3;
    max-width: min(62vw, 30rem);
    mix-blend-mode: difference;
    color: #fff;
    pointer-events: none;
  }

  .eyebrow {
    margin: 0 0 0.5rem;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.34em;
    text-transform: uppercase;
  }

  .title {
    margin: 0;
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-optical-sizing: auto;
    font-weight: 400;
    font-size: clamp(1.35rem, 3.1vw, 2.1rem);
    line-height: 1.12;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .telemetry {
    position: absolute;
    left: clamp(18px, 3.4vw, 44px);
    bottom: clamp(16px, 3vw, 34px);
    z-index: 3;
    margin: 0;
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    color: #fff;
    mix-blend-mode: difference;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }

  /* ---- control panel --------------------------------------- */
  .panel {
    position: absolute;
    right: clamp(14px, 2.6vw, 34px);
    bottom: clamp(14px, 2.6vw, 34px);
    z-index: 4;
    width: min(20rem, calc(100vw - 28px));
    max-height: calc(100vh - 28px);
    overflow-y: auto;
    background: var(--panel-bg);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    border: 1px solid var(--panel-line);
    color: var(--bone);
    cursor: default;
  }

  .sect + .sect {
    border-top: 1px solid var(--panel-line);
  }

  .panel__head {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.85rem 1rem;
    background: none;
    border: 0;
    border-bottom: 1px solid var(--panel-line);
    color: var(--bone);
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .panel__head svg {
    width: 14px;
    height: 14px;
    flex: none;
    transition: transform 0.25s var(--ease-ui);
  }

  .panel__head[aria-expanded="false"] {
    border-bottom-color: transparent;
  }

  .panel__head[aria-expanded="false"] svg {
    transform: rotate(-90deg);
  }

  .panel__body {
    padding: 0.35rem 1rem 0.9rem;
    display: flex;
    flex-direction: column;
  }

  .row {
    display: grid;
    grid-template-columns: 5.2rem 1fr auto;
    align-items: center;
    gap: 0.7rem;
    padding: 0.55rem 0;
    border-bottom: 1px solid rgba(233, 227, 214, 0.07);
  }

  .panel__body > .row:last-child {
    border-bottom: 0;
  }

  .row__label {
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    color: var(--bone-dim);
  }

  .row__label small {
    opacity: 0.6;
  }

  .row--seg {
    grid-template-columns: 5.2rem 1fr;
  }

  .row--hold {
    transition: opacity 0.25s var(--ease-ui);
  }

  .panel[data-mode="continuous"] .row--hold {
    opacity: 0.32;
    pointer-events: none;
  }

  /* surface sub-rows show only for the active background type */
  .bg-only {
    display: none;
  }
  .panel[data-bg="solid"] .row.bg-solid,
  .panel[data-bg="gradient"] .row.bg-gradient,
  .panel[data-bg="image"] .row.bg-image {
    display: grid;
  }
  .panel[data-bg="image"] p.hint {
    display: block;
  }

  .hint {
    display: none;
    margin: 0.1rem 0 0;
    font-size: 0.62rem;
    line-height: 1.4;
    letter-spacing: 0.02em;
    color: var(--greige);
  }

  /* ---- sliders ------------------------------------------------ */
  .slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 26px;
    background: transparent;
    cursor: pointer;
    margin: 0;
  }

  .slider::-webkit-slider-runnable-track {
    height: 26px;
    border-radius: 2px;
    background: linear-gradient(
      90deg,
      var(--terracotta) 0 var(--pct, 40%),
      rgba(233, 227, 214, 0.12) var(--pct, 40%) 100%
    );
  }
  .slider::-moz-range-track {
    height: 26px;
    border-radius: 2px;
    background: rgba(233, 227, 214, 0.12);
  }
  .slider::-moz-range-progress {
    height: 26px;
    border-radius: 2px;
    background: var(--terracotta);
  }
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 4px;
    height: 26px;
    background: var(--bone);
    border: 0;
    border-radius: 1px;
  }
  .slider::-moz-range-thumb {
    width: 4px;
    height: 26px;
    background: var(--bone);
    border: 0;
    border-radius: 1px;
  }
  .slider:focus-visible::-webkit-slider-runnable-track {
    outline: 2px solid var(--terracotta-bright);
    outline-offset: 2px;
  }

  .val {
    font-size: 0.74rem;
    color: var(--bone);
    font-variant-numeric: tabular-nums;
    min-width: 2.7rem;
    text-align: right;
  }

  /* ---- colour + text inputs -------------------------------- */
  .swatch-input {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 26px;
    padding: 0;
    border: 1px solid var(--panel-line);
    background: none;
    cursor: pointer;
  }
  .swatch-input::-webkit-color-swatch-wrapper {
    padding: 2px;
  }
  .swatch-input::-webkit-color-swatch {
    border: 0;
    border-radius: 0;
  }
  .swatch-input::-moz-color-swatch {
    border: 0;
  }

  .text-input {
    width: 100%;
    height: 26px;
    background: rgba(233, 227, 214, 0.08);
    border: 1px solid var(--panel-line);
    color: var(--bone);
    font-family: inherit;
    font-size: 0.68rem;
    padding: 0 0.45rem;
  }
  .text-input::placeholder {
    color: var(--greige);
  }

  /* ---- segmented controls ---------------------------------- */
  .seg {
    display: flex;
    gap: 2px;
    padding: 2px;
    background: rgba(233, 227, 214, 0.08);
  }
  .seg button {
    flex: 1;
    padding: 0.44rem 0.3rem;
    background: none;
    border: 0;
    color: var(--greige);
    font-family: inherit;
    font-size: 0.66rem;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: background 0.18s var(--ease-ui), color 0.18s var(--ease-ui);
  }
  .seg button[aria-checked="true"] {
    background: var(--bone);
    color: var(--ink);
    font-weight: 700;
  }
  .seg button:focus-visible {
    outline: 2px solid var(--terracotta-bright);
    outline-offset: -2px;
  }

  /* ---- image preset swatches ------------------------------- */
  .bg-swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .bg-swatches button {
    width: 34px;
    height: 26px;
    padding: 0;
    border: 1px solid var(--panel-line);
    background-size: cover;
    background-position: center;
    cursor: pointer;
    filter: saturate(1.05);
  }
  .bg-swatches button[aria-pressed="true"] {
    outline: 2px solid var(--terracotta-bright);
    outline-offset: 1px;
  }

  /* ---- play / pause --------------------------------------- */
  .playState {
    position: absolute;
    right: clamp(14px, 2.6vw, 34px);
    top: clamp(14px, 2.6vw, 34px);
    z-index: 4;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    background: var(--panel-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--panel-line);
    color: var(--bone);
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    cursor: pointer;
  }

  :focus-visible {
    outline: 2px solid var(--terracotta-bright);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .panel__head svg,
    .seg button,
    .backdrop {
      transition: none;
    }
  }

  @media (max-width: 560px) {
    .row {
      grid-template-columns: 4.4rem 1fr auto;
      gap: 0.5rem;
    }
    .placard {
      max-width: 78vw;
    }
  }
</style>

</head>

        <p class="hint">Remote URLs resolve only where the page is deployed for real — this sandboxed preview blocks off-origin images, so use a preset here.</p>

        <label class="row">
          <span class="row__label">Divider</span>
          <input class="slider" type="range" id="divider" min="2" max="48" step="1" value="12" style="--pct:22%" />
          <span class="val" id="dividerVal">12px</span>
        </label>
      </div>
    </section>
  </form>
</main>

<script>
  (function () {
    "use strict";

    var gridEl = document.getElementById("grid");
    var cells = Array.prototype.slice.call(gridEl.querySelectorAll(".cell img"));
    var IMGS = cells.map(function (c) {
      return c.getAttribute("src");
    });
    var telemetry = document.getElementById("telemetry");
    var stage = document.getElementById("stage");
    var playBtn = document.getElementById("playState");
    var panel = document.getElementById("panel");
    var backdrop = document.getElementById("backdrop");

    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // ---- parameters (defaults mirror the reference panel) --------
    var params = { speed: 40, amp: 60, hold: 1500, mode: "continuous", ease: "smooth" };

    // ---- boundary model -----------------------------------------
    var REST = { v1: 0.335, v2: 0.665, h1: 0.5 };
    var TRAVEL = { v1: 0.2, v2: 0.2, h1: 0.11 };
    var MIN_COL = 0.07;
    var MIN_ROW = 0.14;

    var OSC = {
      v1: { p1: 0.0, p2: 1.7, f1: 0.55, f2: 1.19 },
      v2: { p1: 2.3, p2: 0.5, f1: 0.47, f2: 1.31 },
      h1: { p1: 0.9, p2: 3.4, f1: 0.63, f2: 1.07 }
    };
    var seed = { v1: 0, v2: 0, h1: 0 };

    var pulse = {
      from: { v1: REST.v1, v2: REST.v2, h1: REST.h1 },
      to: { v1: REST.v1, v2: REST.v2, h1: REST.h1 },
      start: 0,
      dur: 900,
      settled: false,
      holdUntil: 0
    };

    // ---- easing ------------------------------------------------
    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }
    function smootherstep(t) {
      return t * t * t * (t * (t * 6 - 15) + 10);
    }
    function easeOutSpring(t) {
      if (t <= 0) return 0;
      if (t >= 1) return 1;
      var c = (2 * Math.PI) / 3;
      return Math.pow(2, -9 * t) * Math.sin((t * 9 - 0.75) * c) + 1;
    }
    function pulseEase(t) {
      if (params.ease === "easeout") return easeOutCubic(t);
      if (params.ease === "spring") return easeOutSpring(t);
      return smootherstep(t);
    }

    function wave(osc, ph, freqScale, t) {
      var x1 = t * osc.f1 * freqScale + osc.p1 + ph;
      var x2 = t * osc.f2 * freqScale + osc.p2 + ph;
      var base = 0.74 * Math.sin(x1) + 0.26 * Math.sin(x2 + 1.3);
      if (params.ease === "easeout") {
        base = Math.sign(base) * Math.pow(Math.abs(base), 1.35);
      } else if (params.ease === "spring") {
        base += 0.14 * Math.sin(x1 * 3.1 + 0.6);
        base *= 0.94;
      }
      return base;
    }

    function clamp(v, lo, hi) {
      return v < lo ? lo : v > hi ? hi : v;
    }

    function resolve(t) {
      var ampFrac = params.amp / 100;
      var v1, v2, h1;

      if (params.mode === "pulse") {
        var now = t * 1000;
        var k = clamp((now - pulse.start) / pulse.dur, 0, 1);
        var e = pulseEase(k);
        v1 = pulse.from.v1 + (pulse.to.v1 - pulse.from.v1) * e;
        v2 = pulse.from.v2 + (pulse.to.v2 - pulse.from.v2) * e;
        h1 = pulse.from.h1 + (pulse.to.h1 - pulse.from.h1) * e;

        if (k >= 1 && !pulse.settled) {
          pulse.settled = true;
          pulse.holdUntil = now + params.hold;
        }
        if (pulse.settled && now >= pulse.holdUntil) {
          var reach = ampFrac;
          pulse.from = { v1: v1, v2: v2, h1: h1 };
          pulse.to = {
            v1: REST.v1 + (Math.random() * 2 - 1) * TRAVEL.v1 * reach,
            v2: REST.v2 + (Math.random() * 2 - 1) * TRAVEL.v2 * reach,
            h1: REST.h1 + (Math.random() * 2 - 1) * TRAVEL.h1 * reach
          };
          pulse.start = now;
          pulse.dur = 1650 - params.speed * 12;
          pulse.settled = false;
        }
      } else {
        var freqScale = 0.16 + (params.speed / 100) * 1.15;
        v1 = REST.v1 + wave(OSC.v1, seed.v1, freqScale, t) * TRAVEL.v1 * ampFrac;
        v2 = REST.v2 + wave(OSC.v2, seed.v2, freqScale, t) * TRAVEL.v2 * ampFrac;
        h1 = REST.h1 + wave(OSC.h1, seed.h1, freqScale, t) * TRAVEL.h1 * ampFrac;
      }

      v1 = clamp(v1, MIN_COL, 1 - 2 * MIN_COL);
      v2 = clamp(v2, v1 + MIN_COL, 1 - MIN_COL);
      if (v2 - v1 < MIN_COL) {
        var mid = (v1 + v2) / 2;
        v1 = mid - MIN_COL / 2;
        v2 = mid + MIN_COL / 2;
      }
      h1 = clamp(h1, MIN_ROW, 1 - MIN_ROW);
      return { v1: v1, v2: v2, h1: h1 };
    }

    // ---- paint ----------------------------------------------
    var lastTelemetry = 0;
    function paint(b, tMs) {
      var c1 = b.v1;
      var c2 = b.v2 - b.v1;
      var c3 = 1 - b.v2;
      gridEl.style.gridTemplateColumns =
        c1.toFixed(4) + "fr " + c2.toFixed(4) + "fr " + c3.toFixed(4) + "fr";
      gridEl.style.gridTemplateRows = b.h1.toFixed(4) + "fr " + (1 - b.h1).toFixed(4) + "fr";

      var ts = tMs / 1000;
      for (var i = 0; i < cells.length; i++) {
        var ox = 50 + Math.sin(ts * 0.11 + i * 1.9) * 3.2;
        var oy = 50 + Math.cos(ts * 0.09 + i * 2.7) * 3.2;
        cells[i].style.objectPosition = ox.toFixed(2) + "% " + oy.toFixed(2) + "%";
      }

      if (tMs - lastTelemetry > 140) {
        lastTelemetry = tMs;
        var p = function (n) {
          return String(Math.round(n * 100)).padStart(2, "0");
        };
        telemetry.textContent =
          "cols " + p(c1) + "·" + p(c2) + "·" + p(c3) +
          " · rows " + p(b.h1) + "·" + p(1 - b.h1);
      }
    }

    // ---- loop ----------------------------------------------
    var running = !reduceMotion;
    var startTs = null;
    var pausedAt = 0;
    var rafId = null;

    function frame(now) {
      if (startTs === null) startTs = now - pausedAt;
      var elapsed = now - startTs;
      paint(resolve(elapsed / 1000), elapsed);
      if (running) rafId = requestAnimationFrame(frame);
    }

    function play() {
      if (running || reduceMotion) return;
      running = true;
      startTs = null;
      playBtn.textContent = "❚❚";
      playBtn.setAttribute("aria-label", "Pause motion");
      playBtn.setAttribute("aria-pressed", "false");
      rafId = requestAnimationFrame(frame);
    }

    function pause() {
      if (!running) return;
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
      pausedAt = performance.now() - (startTs || performance.now());
      playBtn.textContent = "▶";
      playBtn.setAttribute("aria-label", "Resume motion");
      playBtn.setAttribute("aria-pressed", "true");
    }

    function toggle() {
      running ? pause() : play();
    }

    function renderStatic() {
      var t = 7.3 + (pausedAt || 0) / 1000;
      paint(resolve(t), t * 1000);
    }

    // ---- background surface -------------------------------
    var bg = {
      type: "solid",
      color: "#0b0b0c",
      gradFrom: "#c25842",
      gradTo: "#45568a",
      gradAngle: 145,
      imgIndex: 0,
      imgUrl: ""
    };

    function applyBackground() {
      panel.setAttribute("data-bg", bg.type);
      if (bg.type === "solid") {
        backdrop.style.backgroundImage = "none";
        backdrop.style.backgroundColor = bg.color;
      } else if (bg.type === "gradient") {
        backdrop.style.backgroundColor = "transparent";
        backdrop.style.backgroundImage =
          "linear-gradient(" + bg.gradAngle + "deg, " + bg.gradFrom + ", " + bg.gradTo + ")";
      } else {
        var src = bg.imgUrl.trim() || IMGS[bg.imgIndex] || IMGS[0];
        backdrop.style.backgroundColor = "#0b0b0c";
        backdrop.style.backgroundImage = 'url("' + src.replace(/"/g, '\\"') + '")';
      }
      save();
    }

    // ---- persistence (per-viewer convenience) -------------
    var KEY = "kdg-v1";
    function save() {
      try {
        localStorage.setItem(
          KEY,
          JSON.stringify({ params: params, bg: bg, divider: dividerEl.value })
        );
      } catch (e) {}
    }
    function load() {
      try {
        return JSON.parse(localStorage.getItem(KEY) || "null");
      } catch (e) {
        return null;
      }
    }

    // ---- control wiring ----------------------------------
    var dividerEl = document.getElementById("divider");

    function setSliderFill(el) {
      var pct = ((el.value - el.min) / (el.max - el.min)) * 100;
      el.style.setProperty("--pct", pct.toFixed(1) + "%");
    }

    function bindSlider(id, valId, apply) {
      var el = document.getElementById(id);
      var out = valId ? document.getElementById(valId) : null;
      el.addEventListener("input", function () {
        apply(el, out);
        setSliderFill(el);
        if (!running) renderStatic();
      });
    }

    bindSlider("speed", "speedVal", function (el, out) {
      params.speed = Number(el.value);
      out.textContent = el.value;
      save();
    });
    bindSlider("amp", "ampVal", function (el, out) {
      params.amp = Number(el.value);
      out.textContent = el.value;
      save();
    });
    bindSlider("hold", "holdVal", function (el, out) {
      params.hold = Number(el.value);
      out.textContent = el.value;
      save();
    });
    bindSlider("divider", "dividerVal", function (el, out) {
      document.documentElement.style.setProperty("--gutter", el.value + "px");
      out.textContent = el.value + "px";
      save();
    });
    bindSlider("gradAngle", "gradAngleVal", function (el, out) {
      bg.gradAngle = Number(el.value);
      out.textContent = el.value + "°";
      applyBackground();
    });

    function bindColor(id, valId, key) {
      var el = document.getElementById(id);
      var out = document.getElementById(valId);
      el.addEventListener("input", function () {
        bg[key] = el.value;
        out.textContent = el.value.toUpperCase();
        applyBackground();
        if (!running) renderStatic();
      });
    }
    bindColor("bgColor", "bgColorVal", "color");
    bindColor("gradFrom", "gradFromVal", "gradFrom");
    bindColor("gradTo", "gradToVal", "gradTo");

    var bgUrlEl = document.getElementById("bgUrl");
    bgUrlEl.addEventListener("input", function () {
      bg.imgUrl = bgUrlEl.value;
      applyBackground();
    });

    // image preset swatches
    var swatchWrap = document.getElementById("bgSwatches");
    IMGS.forEach(function (src, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.style.backgroundImage = 'url("' + src.replace(/"/g, '\\"') + '")';
      b.setAttribute("aria-pressed", String(i === 0));
      b.setAttribute("aria-label", "Preset image " + (i + 1));
      b.addEventListener("click", function () {
        bg.imgIndex = i;
        bg.imgUrl = "";
        bgUrlEl.value = "";
        Array.prototype.forEach.call(swatchWrap.children, function (c, j) {
          c.setAttribute("aria-pressed", String(j === i));
        });
        applyBackground();
        if (!running) renderStatic();
      });
      swatchWrap.appendChild(b);
    });

    function bindSeg(segId, onChange) {
      var seg = document.getElementById(segId);
      var btns = Array.prototype.slice.call(seg.querySelectorAll("button"));
      seg.addEventListener("click", function (e) {
        var btn = e.target.closest("button");
        if (!btn) return;
        btns.forEach(function (b) {
          b.setAttribute("aria-checked", String(b === btn));
        });
        onChange(btn.dataset.v);
        if (!running) renderStatic();
      });
      seg.addEventListener("keydown", function (e) {
        if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
        e.preventDefault();
        var i = btns.findIndex(function (b) {
          return b.getAttribute("aria-checked") === "true";
        });
        i = (i + (e.key === "ArrowRight" ? 1 : btns.length - 1)) % btns.length;
        btns[i].click();
        btns[i].focus();
      });
    }

    bindSeg("modeSeg", function (v) {
      params.mode = v;
      panel.setAttribute("data-mode", v);
      if (v === "pulse") {
        var b = resolve((pausedAt || performance.now()) / 1000);
        pulse.from = { v1: b.v1, v2: b.v2, h1: b.h1 };
        pulse.to = { v1: b.v1, v2: b.v2, h1: b.h1 };
        pulse.start = performance.now();
        pulse.dur = 1;
        pulse.settled = false;
      }
      save();
    });
    bindSeg("easeSeg", function (v) {
      params.ease = v;
      save();
    });
    bindSeg("bgSeg", function (v) {
      bg.type = v;
      applyBackground();
    });

    // collapsible sections
    Array.prototype.forEach.call(panel.querySelectorAll(".panel__head"), function (head) {
      head.addEventListener("click", function () {
        var body = document.getElementById(head.dataset.target);
        var open = head.getAttribute("aria-expanded") === "true";
        head.setAttribute("aria-expanded", String(!open));
        body.hidden = open;
      });
    });

    panel.addEventListener("submit", function (e) {
      e.preventDefault();
    });

    // play / pause: button, click on the art, spacebar; R reseeds
    playBtn.addEventListener("click", toggle);
    stage.addEventListener("click", function (e) {
      if (e.target.closest(".panel, .playState")) return;
      toggle();
    });
    window.addEventListener("keydown", function (e) {
      if (e.target.matches("input, button, [contenteditable]")) return;
      if (e.code === "Space") {
        e.preventDefault();
        toggle();
      } else if (e.key === "r" || e.key === "R") {
        seed.v1 = Math.random() * 6.283;
        seed.v2 = Math.random() * 6.283;
        seed.h1 = Math.random() * 6.283;
        if (!running) renderStatic();
      }
    });

    // ---- hydrate from storage, then go -------------------
    (function hydrate() {
      var s = load();
      if (s && s.params) {
        ["speed", "amp", "hold", "mode", "ease"].forEach(function (k) {
          if (s.params[k] != null) params[k] = s.params[k];
        });
      }
      if (s && s.bg) {
        Object.keys(bg).forEach(function (k) {
          if (s.bg[k] != null) bg[k] = s.bg[k];
        });
      }
      var storedDivider = s && s.divider != null ? s.divider : dividerEl.value;

      // reflect params into the motion controls
      var set = function (id, v) {
        document.getElementById(id).value = v;
      };
      set("speed", params.speed);
      set("amp", params.amp);
      set("hold", params.hold);
      set("divider", storedDivider);
      document.getElementById("speedVal").textContent = params.speed;
      document.getElementById("ampVal").textContent = params.amp;
      document.getElementById("holdVal").textContent = params.hold;
      document.getElementById("dividerVal").textContent = storedDivider + "px";
      document.documentElement.style.setProperty("--gutter", storedDivider + "px");
      ["speed", "amp", "hold", "divider"].forEach(function (id) {
        setSliderFill(document.getElementById(id));
      });

      var checkSeg = function (segId, val) {
        Array.prototype.forEach.call(
          document.getElementById(segId).querySelectorAll("button"),
          function (b) {
            b.setAttribute("aria-checked", String(b.dataset.v === val));
          }
        );
      };
      checkSeg("modeSeg", params.mode);
      checkSeg("easeSeg", params.ease);
      checkSeg("bgSeg", bg.type);
      panel.setAttribute("data-mode", params.mode);

      // reflect background into its controls
      document.getElementById("bgColor").value = bg.color;
      document.getElementById("bgColorVal").textContent = bg.color.toUpperCase();
      document.getElementById("gradFrom").value = bg.gradFrom;
      document.getElementById("gradFromVal").textContent = bg.gradFrom.toUpperCase();
      document.getElementById("gradTo").value = bg.gradTo;
      document.getElementById("gradToVal").textContent = bg.gradTo.toUpperCase();
      set("gradAngle", bg.gradAngle);
      document.getElementById("gradAngleVal").textContent = bg.gradAngle + "°";
      setSliderFill(document.getElementById("gradAngle"));
      bgUrlEl.value = bg.imgUrl || "";
      Array.prototype.forEach.call(swatchWrap.children, function (c, j) {
        c.setAttribute("aria-pressed", String(j === bg.imgIndex && !bg.imgUrl));
      });

      applyBackground();
    })();

    if (reduceMotion) {
      playBtn.hidden = true;
      renderStatic();
    } else {
      rafId = requestAnimationFrame(frame);
    }
  })();
</script>

</body>
</html>
